format = """
[](pink)\
$directory\
[](fg:pink bg:cyan)\
$c\
$haskell\
$java\
$kotlin\
$nodejs\
$python\
$rust\
[](fg:cyan bg:gray)\
$git_branch\
$git_status\
[ ](fg:cyan)\
$line_break\
$character"""

right_format = """
$cmd_duration\
[](cyan)\
$time\
[](fg:cyan bg:pink)\
$username\
[](fg:pink bg:pink)\
$os\
[ ](pink)"""

continuation_prompt = '▶▶ '

# NUEVA PALETA (custom cyber grayscale)
palette = 'cyber_grayscale'
add_newline = true

[os]
disabled = false
style = "bg:pink fg:black"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

[username]
show_always = true
style_user = "bg:pink fg:black"
style_root = "bg:pink fg:black"
format = '[ $user]($style)'

[directory]
style = "bg:pink fg:black"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol $branch ](fg:black bg:cyan)]($style)'

[git_commit]
commit_hash_length = 7
format = '[\($hash$tag\)]($style)'
tag_symbol = '🔖 '

[git_status]
style = "bg:cyan"
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)](fg:black bg:cyan)( $ahead_behind  )](fg:black bg:cyan)"
conflicted = " 󱚡 "
untracked = "  "
modified = "  "
staged = "  "
renamed = "  "
deleted = " 󱂥 "
stashed = " 󰈉 "

[nodejs]
symbol = ""
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[c]
symbol = " "
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[rust]
symbol = ""
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[golang]
symbol = ""
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[php]
symbol = ""
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[java]
symbol = " "
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[kotlin]
symbol = ""
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[haskell]
symbol = ""
style = "bg:gray"
format = '[[ $symbol( $version) ](fg:black bg:gray)]($style)'

[python]
symbol = ""
style = "bg:gray"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:black bg:gray)]($style)'

[docker_context]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $context) ](fg:black bg:cyan)]($style)'

[conda]
symbol = "  "
style = "fg:black bg:cyan"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:cyan"
format = '[[ 󰥔 $time ](fg:black bg:cyan)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[  ](bold fg:green)'
error_symbol = '[  ](bold fg:red)'
vimcmd_symbol = '[  ](bold fg:green)'
vimcmd_replace_one_symbol = '[  ](bold fg:cyan)'
vimcmd_replace_symbol = '[❮](bold fg:cyan)'
vimcmd_visual_symbol = '[❮](bold fg:pink)'

[cmd_duration]
show_milliseconds = false
format = "󰓅 $duration "
style = "bg:cyan"
disabled = false
show_notifications = false
min_time_to_notify = 45000


# =========================
# PALETA PERSONALIZADA
# ========================
[palettes.cyber_grayscale]
black = "#1e1e1e"
gray = "#00daf0"
gray_soft = "#555555"

text = "#d6d6d6"
muted = "#a0a0a0"

# pink = "#ff1493"
pink = "#c06090"
pink_soft = "#ff69b4"

cyan = "#00daf0"
cyan_soft = "#7befff"

white = "#ffffff"



